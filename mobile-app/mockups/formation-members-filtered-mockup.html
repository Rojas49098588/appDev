<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formation — Members (filtered)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:   #E8E6E0;
    --surface: #F6F5F1;
    --ink:     #22201D;
    --ink-soft:#6E6960;
    --ink-faint:#9A9488;
    --line:    #D2CDC2;
    --line-soft:#DEDACF;
    --rust:    #AC4A2E;
    --rust-tint:#F1E1DA;
    --wash:    #3F6E82;
    --wash-tint:#DDE6E7;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-font-smoothing:antialiased; }

  body{
    margin:0;
    background:#C9C5BB;
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14px;
    line-height:1.45;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 12px;
  }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  .device{
    width:390px; height:844px;
    background:var(--ink);
    border-radius:46px;
    padding:14px;
    box-shadow:0 30px 60px rgba(0,0,0,0.28);
    flex:0 0 auto;
  }
  .screen{
    width:100%; height:100%;
    background:var(--paper);
    border-radius:34px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .statusbar{
    height:46px; flex:0 0 auto;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 26px 6px;
    font-family:'IBM Plex Mono', monospace; font-size:12px;
  }
  .statusbar .icons{ display:flex; gap:5px; }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:var(--ink);
    border-radius:0 0 16px 16px; z-index:5;
  }

  .app-body{ flex:1; display:flex; overflow:hidden; }

  .tape{
    width:26px; flex:0 0 26px;
    border-right:1px solid var(--line);
    position:relative;
  }
  .tape .tick{
    position:absolute; left:0; right:0;
    display:flex; justify-content:flex-end; align-items:center; gap:4px;
    color:var(--ink-faint);
    font-family:'IBM Plex Mono', monospace; font-size:8.5px;
  }
  .tape .tick span.mark{ width:6px; height:1px; background:var(--ink-faint); display:block; }
  .tape .tick.major span.mark{ width:10px; background:var(--ink-soft); }
  .tape .tick.major{ color:var(--ink-soft); }

  .content{ flex:1; overflow-y:auto; padding:16px 18px 28px; }
  .content::-webkit-scrollbar{ display:none; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:14px;
  }
  .back-btn{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .back-btn svg{ width:19px; height:19px; }
  .page-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:18px; margin:0; }
  .spacer{ width:30px; flex:0 0 auto; }

  /* active filter banner — reflects which flag button was tapped */
  .filter-banner{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--wash);
    background:var(--wash-tint);
    color:var(--wash);
    padding:10px 12px;
    margin-bottom:16px;
    font-size:12.5px;
  }
  .filter-banner .filter-left{ display:flex; align-items:center; gap:7px; }
  .filter-banner b{ font-weight:600; }
  .filter-clear{ width:16px; height:16px; cursor:pointer; }

  .result-count{ font-size:11.5px; color:var(--ink-soft); margin-bottom:12px; }
  .result-count b{ color:var(--ink); font-weight:500; }

  /* member row */
  .member{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--line); background:var(--surface);
    padding:12px 13px; margin-bottom:8px; cursor:pointer;
  }
  .m-avatar{
    width:36px; height:36px; border-radius:50%;
    background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600;
  }
  .m-info{ flex:1; min-width:0; }
  .m-name{ font-size:13.5px; font-weight:500; }
  .m-section{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .m-item{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11px; color:var(--wash); margin-top:6px;
  }
  .m-item .dot{ width:5px; height:5px; border-radius:1px; background:var(--wash); transform:rotate(45deg); flex:0 0 auto; }
  .m-chevron{ width:14px; height:14px; color:var(--ink-faint); flex:0 0 auto; }

  /* bottom nav */
  nav.tabbar{ flex:0 0 auto; display:flex; border-top:1px solid var(--line); background:var(--surface); padding:9px 6px 4px; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-faint); }
  .tab.active{ color:var(--ink); }
  .tab svg{ width:19px; height:19px; }
  .tab .tab-label{ font-size:9.5px; }
  .home-indicator{ width:120px; height:4px; background:var(--ink); border-radius:2px; opacity:0.6; margin:6px auto 2px; }
</style>
</head>
<body>

<div class="device">
  <div class="screen">
    <div class="notch"></div>

    <div class="statusbar">
      <span>9:41</span>
      <div class="icons"><span>◈</span><span>◉</span><span>▮</span></div>
    </div>

    <div class="app-body">

      <div class="tape">
        <div class="tick major" style="top:2%"><span>40</span><span class="mark"></span></div>
        <div class="tick" style="top:24%"><span>30</span><span class="mark"></span></div>
        <div class="tick major" style="top:46%"><span>20</span><span class="mark"></span></div>
        <div class="tick" style="top:68%"><span>10</span><span class="mark"></span></div>
        <div class="tick major" style="top:90%"><span>0</span><span class="mark"></span></div>
      </div>

      <div class="content">

        <header class="top">
          <div class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg></div>
          <h1 class="page-title">Members</h1>
          <div class="spacer"></div>
        </header>

        <!-- reflects that "Dirty · 2" was tapped on the Coats row in Inventory -->
        <div class="filter-banner">
          <div class="filter-left">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>
            <span>Filtered — <b>Coats</b> · <b>Dirty</b></span>
          </div>
          <svg class="filter-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>

        <div class="result-count"><b>2</b> members with a dirty coat on file</div>

        <div class="member">
          <div class="m-avatar">MC</div>
          <div class="m-info">
            <div class="m-name">Maya Chen</div>
            <div class="m-section">Trumpet</div>
            <div class="m-item"><span class="dot"></span>Coat — Blue — 208</div>
          </div>
          <svg class="m-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>
        </div>

        <div class="member">
          <div class="m-avatar">OD</div>
          <div class="m-info">
            <div class="m-name">Owen Diaz</div>
            <div class="m-section">Baritone</div>
            <div class="m-item"><span class="dot"></span>Coat — Purple — 160</div>
          </div>
          <svg class="m-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6l6 6-6 6"/></svg>
        </div>

      </div>
    </div>

    <nav class="tabbar">
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11L12 4l8 7"/><path d="M6 10v9h12v-9"/></svg>
        <span class="tab-label">Home</span>
      </div>
      <div class="tab active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>
        <span class="tab-label">Sections</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>
        <span class="tab-label">Catalogue</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
        <span class="tab-label">Inventory</span>
      </div>
    </nav>
    <div class="home-indicator"></div>
  </div>
</div>

</body>
</html>
