<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formation — Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:   #E8E6E0;
    --surface: #F6F5F1;
    --ink:     #22201D;
    --ink-soft:#6E6960;
    --ink-faint:#9A9488;
    --line:    #D2CDC2;
    --line-soft:#DEDACF;
    --rust:    #AC4A2E;
    --rust-tint:#F1E1DA;
    --wash:    #3F6E82;
    --wash-tint:#DDE6E7;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-font-smoothing:antialiased; }

  body{
    margin:0;
    background:#C9C5BB;
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14px;
    line-height:1.45;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 12px;
  }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  .device{
    width:390px; height:844px;
    background:var(--ink);
    border-radius:46px;
    padding:14px;
    box-shadow:0 30px 60px rgba(0,0,0,0.28);
    flex:0 0 auto;
  }
  .screen{
    width:100%; height:100%;
    background:var(--paper);
    border-radius:34px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .statusbar{
    height:46px; flex:0 0 auto;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 26px 6px;
    font-family:'IBM Plex Mono', monospace; font-size:12px;
  }
  .statusbar .icons{ display:flex; gap:5px; }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:var(--ink);
    border-radius:0 0 16px 16px; z-index:5;
  }

  .app-body{ flex:1; display:flex; overflow:hidden; }

  .tape{
    width:26px; flex:0 0 26px;
    border-right:1px solid var(--line);
    position:relative;
  }
  .tape .tick{
    position:absolute; left:0; right:0;
    display:flex; justify-content:flex-end; align-items:center; gap:4px;
    color:var(--ink-faint);
    font-family:'IBM Plex Mono', monospace; font-size:8.5px;
  }
  .tape .tick span.mark{ width:6px; height:1px; background:var(--ink-faint); display:block; }
  .tape .tick.major span.mark{ width:10px; background:var(--ink-soft); }
  .tape .tick.major{ color:var(--ink-soft); }

  .content{ flex:1; overflow-y:auto; padding:16px 18px 28px; }
  .content::-webkit-scrollbar{ display:none; }

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:6px;
  }
  .back-btn{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .back-btn svg{ width:19px; height:19px; }
  .page-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:18px; margin:0; }
  .spacer{ width:30px; flex:0 0 auto; }

  .intro{ font-size:12.5px; color:var(--ink-soft); margin:2px 0 26px; }

  /* form field */
  .field{ margin-bottom:22px; }
  .field-label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:7px; }
  .text-input{
    border:1px solid var(--line); background:var(--surface);
    padding:12px 13px; font-size:14px; color:var(--ink-faint);
    font-family:'IBM Plex Sans', sans-serif;
  }
  .name-row{ display:flex; gap:10px; }
  .name-row .field{ flex:1; margin-bottom:0; }

  /* instrument wheel picker */
  .wheel{
    position:relative;
    height:180px;
    border:1px solid var(--line);
    background:var(--surface);
    overflow:hidden;
  }
  .wheel-highlight{
    position:absolute; left:0; right:0; top:72px; height:36px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    pointer-events:none;
  }
  .wheel-rows{ display:flex; flex-direction:column; }
  .wheel-row{
    height:36px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint); font-size:13.5px;
  }
  .wheel-row.near{ color:var(--ink-soft); font-size:14.5px; }
  .wheel-row.selected{
    color:var(--ink); font-weight:600; font-size:16px;
    font-family:'Space Grotesk', sans-serif;
  }

  /* member / staff segmented toggle */
  .segmented{ display:flex; border:1px solid var(--ink); }
  .segment{
    flex:1; text-align:center; padding:13px; font-size:13.5px; font-weight:500;
    color:var(--ink); background:var(--surface);
  }
  .segment.active{ background:var(--ink); color:var(--paper); }
  .segment + .segment{ border-left:1px solid var(--ink); }

  /* footer submit */
  .footer{ flex:0 0 auto; padding:14px 18px 4px; border-top:1px solid var(--line); background:var(--surface); }
  .submit-btn{
    display:block; width:100%; padding:14px; text-align:center;
    background:var(--ink); color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif; font-size:14px; font-weight:500; border:none;
  }
  .home-indicator{ width:120px; height:4px; background:var(--ink); border-radius:2px; opacity:0.6; margin:8px auto 2px; }
</style>
</head>
<body>

<div class="device">
  <div class="screen">
    <div class="notch"></div>

    <div class="statusbar">
      <span>9:41</span>
      <div class="icons"><span>◈</span><span>◉</span><span>▮</span></div>
    </div>

    <div class="app-body">

      <div class="tape">
        <div class="tick major" style="top:2%"><span>40</span><span class="mark"></span></div>
        <div class="tick" style="top:24%"><span>30</span><span class="mark"></span></div>
        <div class="tick major" style="top:46%"><span>20</span><span class="mark"></span></div>
        <div class="tick" style="top:68%"><span>10</span><span class="mark"></span></div>
        <div class="tick major" style="top:90%"><span>0</span><span class="mark"></span></div>
      </div>

      <div class="content">

        <header class="top">
          <div class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg></div>
          <h1 class="page-title">Create account</h1>
          <div class="spacer"></div>
        </header>

        <p class="intro">A few details before you join Central High Band.</p>

        <div class="name-row">
          <div class="field">
            <div class="field-label">First name</div>
            <div class="text-input">First name</div>
          </div>
          <div class="field">
            <div class="field-label">Last name</div>
            <div class="text-input">Last name</div>
          </div>
        </div>

        <div class="field">
          <div class="field-label">Instrument</div>
          <div class="wheel">
            <div class="wheel-highlight"></div>
            <div class="wheel-rows" style="margin-top:0px;">
              <div class="wheel-row">Trumpet</div>
              <div class="wheel-row near">Mellophone</div>
              <div class="wheel-row selected">Baritone</div>
              <div class="wheel-row near">Trombone</div>
              <div class="wheel-row">Tuba</div>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="field-label">Role</div>
          <div class="segmented">
            <div class="segment active">Member</div>
            <div class="segment">Staff</div>
          </div>
        </div>

      </div>
    </div>

    <div class="footer">
      <div class="submit-btn">Create account</div>
    </div>
    <div class="home-indicator"></div>
  </div>
</div>

</body>
</html>
